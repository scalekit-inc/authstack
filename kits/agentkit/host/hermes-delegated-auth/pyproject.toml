[project]
name = "hermes-delegated-auth"
version = "0.1.0"
description = "Hermes skill: act as a named user through Scalekit AgentKit"
requires-python = ">=3.11"
dependencies = [
    "protobuf>=5.29.6",
    "python-dotenv>=1.1.1",
    "scalekit-sdk-python>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
override-dependencies = [
    "python-dotenv>=1.2.2",
    "cryptography>=46.0.7",
]
